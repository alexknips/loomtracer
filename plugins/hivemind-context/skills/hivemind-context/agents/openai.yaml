interface:
  display_name: "HiveMind Context"
  short_description: "Consult past HiveMind decisions before you change something, by description."
  default_prompt: "Before touching a file, check HiveMind for standing decisions on it. Verify old decisions still hold before relying on them. If a decision rests on nothing declared and you know what it rests on, add it with ground. If one rests on something that changed, list it with reexamine, look again, and only if it still holds say so with reaffirm. Before you disagree with or supersede a decision that rests on something, run verify, show what it rests on and ask whether the disagreement is with the decision or with a premise; if with the premise, disagree or supersede that too, and never drop the action on the decision itself. Never guess a decision id."
