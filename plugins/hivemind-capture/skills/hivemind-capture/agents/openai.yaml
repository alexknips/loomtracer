interface:
  display_name: "HiveMind Capture"
  short_description: "Capture Codex decisions into HiveMind with provenance."
  default_prompt: "Capture durable Codex decision moments in HiveMind as soon as the agent chooses a direction, and say what each decision rests on (a decision already made, something observed, something assumed, or a declared bet), what it binds beyond the edit in front of you, and what undoing it would cost. A choice that binds nothing and is cheap to undo is not a decision, and a request goes to your tracker."
