# A cell created before 0.8.0 has its Postgres database, role and tables, its volume and its
# compose service under the old name `hivemind`. Starting these files on it would make a second,
# empty stack beside the old one: rename it first, with the steps in docs/SELF_HOSTING.md
# ("Upgrading a cell from before 0.8.0").
services:
  loomtracer:
    # Pre-built server image from ghcr; `docker compose pull` fetches it.
    # To build from source instead: docker compose up --build
    # LOOMTRACER_IMAGE overrides this — scripts/cell-update.sh sets it to a
    # locally-built, commit-sha-tagged image so an update never depends on
    # a tagged release existing (hivemind-zdsh.7), and pins it in .env so a
    # later `docker compose up -d` keeps it (hivemind-2mgj).
    image: ${LOOMTRACER_IMAGE:-ghcr.io/alexknips/loomtracer:latest}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GIT_SHA: ${LOOMTRACER_BUILD_SHA:-unknown}
    ports:
      # Published on loopback by default: the cell is reachable only from this
      # host until you choose otherwise. Set LOOMTRACER_PUBLISH_ADDR to a
      # specific interface address (e.g. a tailnet IP) to expose it, or keep
      # loopback and put a TLS reverse proxy in front — see
      # docs/SELF_HOSTING.md, "Exposing the cell deliberately".
      - "${LOOMTRACER_PUBLISH_ADDR:-127.0.0.1}:${LOOMTRACER_PORT:-8080}:8080"
    environment:
      LOOMTRACER_DIR: /data
      LOOMTRACER_PORT: "8080"
      # Postgres backend — resolves to the companion postgres service.
      # Remove to fall back to SQLite stored in the loomtracer-data volume.
      LOOMTRACER_DATABASE_URL: "postgres://loomtracer:${POSTGRES_PASSWORD:-loomtracer}@postgres:5432/loomtracer"
      # Per-tenant bearer tokens are issued via POST /v1/tenants (admin-gated).
      # Set LOOMTRACER_ADMIN_KEY before provisioning your first tenant.
      LOOMTRACER_ADMIN_KEY: "${LOOMTRACER_ADMIN_KEY:-}"
      # Static bearer token for SQLite mode (no LOOMTRACER_DATABASE_URL). An
      # empty value counts as unset; SQLite mode without it refuses to start.
      LOOMTRACER_API_KEY: "${LOOMTRACER_API_KEY:-}"
      # Optional, SQLite mode only: enable the server-side Layer-3 classifier and
      # scorer (Claude Haiku). With LOOMTRACER_DATABASE_URL set, as above, the key is
      # ignored and the server logs a warning; classify keylessly with
      # /loomtracer-capture:classify-queue (docs/KEYLESS_CAPTURE.md).
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      # Optional: comma-separated CORS origins for browser SPA access.
      LOOMTRACER_CORS_ORIGINS: "${LOOMTRACER_CORS_ORIGINS:-}"
    volumes:
      - loomtracer-data:/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/v1/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: loomtracer
      POSTGRES_USER: loomtracer
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-loomtracer}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loomtracer -d loomtracer"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  loomtracer-data:
  postgres-data:
