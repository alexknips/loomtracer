# Compose override for E2E Postgres smoke tests.
# Overrides the image to the locally-built loomtracer:e2e tag.
# LOOMTRACER_DATABASE_URL is inherited from docker-compose.yml (Postgres URL).
# Both postgres and loomtracer start; loomtracer waits for postgres to be healthy
# before accepting connections (depends_on: condition: service_healthy in base).
services:
  loomtracer:
    image: loomtracer:e2e
